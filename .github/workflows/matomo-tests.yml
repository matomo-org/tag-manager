# Action for running tests
# This file has been automatically created.
# To recreate it you can run this command
# ./console generate:test-action --plugin="TagManager" --php-versions="matomo5_min_php,matomo5_max_php" --schedule-cron="45 2 * * 6"

name: Plugin TagManager Tests

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - '**.x-dev'
  workflow_dispatch:
  schedule:
  - cron: "45 2 * * 6"

permissions:
  actions: read
  checks: none
  contents: read
  deployments: none
  issues: read
  packages: none
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: none

concurrency:
  group: php-${{ github.ref }}
  cancel-in-progress: true

jobs:
  PluginTests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: [ 'matomo5_min_php', 'matomo5_max_php' ]
        target: ['${{ github.base_ref || github.ref_name }}']
    steps:
      - uses: actions/checkout@v3
        with:
          lfs: true
          persist-credentials: false
      - name: Install package ripgrep
        run: sudo apt-get install ripgrep
      - name: Run tests
        uses: matomo-org/github-action-tests@main
        with:
          plugin-name: 'TagManager'
          php-version: ${{ matrix.php }}
          test-type: 'PluginTests'
          matomo-test-branch: ${{ matrix.target }}
          artifacts-pass: ${{ secrets.ARTIFACTS_PASS }}
          upload-artifacts: ${{ matrix.php == 'matomo5_min_php' && matrix.target == 'maximum_supported_matomo' }}
  Javascript:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: ['${{ github.base_ref || github.ref_name }}']
    steps:
      - uses: actions/checkout@v3
        with:
          lfs: false
          persist-credentials: false
      - name: running tests
        uses: matomo-org/github-action-tests@main
        with:
          plugin-name: 'TagManager'
          matomo-test-branch: ${{ matrix.target }}
          test-type: 'JS'
          php-version: 'matomo5_min_php'
          node-version: '12'
  UI:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3
        with:
          lfs: true
          persist-credentials: false
      - name: running tests
        uses: matomo-org/github-action-tests@main
        with:
          plugin-name: 'TagManager'
          matomo-test-branch: ${{ github.base_ref || github.ref_name }}
          test-type: 'UI'
          php-version: 'matomo5_min_php'
          node-version: '16'
          artifacts-pass: ${{ secrets.ARTIFACTS_PASS }}
          upload-artifacts: true
