name: Plugins CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - '**.x-dev'
  schedule:
    # Weekly drift check, staggered per repo and done before Monday morning NZT.
    - cron: '42 10 * * 0'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    uses: matomo-org/plugin-ci-workflows/.github/workflows/plugin-ci.yml@main
    with:
      plugin-name: TagManager
      verify-hook: true
      timezone-regression-exempt: 'Formats stored timestamps in the site timezone for display only; tag start/end windows are stored and evaluated in UTC; nothing is grouped or filtered by site day'
