name: Plugins CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - '**.x-dev'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    uses: matomo-org/plugin-ci-workflows/.github/workflows/plugin-ci.yml@main
    with:
      plugin-name: TagManager
      # Activity/ classes extend ActivityLog's base, so PHPStan needs that repository checked
      # out to resolve them; without it it stops with an internal error rather than a finding.
      dependent-plugins: 'innocraft/plugin-ActivityLog'
    secrets:
      TESTS_ACCESS_TOKEN: ${{ secrets.TESTS_ACCESS_TOKEN }}
